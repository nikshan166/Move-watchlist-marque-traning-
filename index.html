<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Watchlist</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- Header -->
        <header>
            <div class="project-label">GITHUB PRACTICE PROJECT</div>
            <h1>Movie Watchlist</h1>
            <p>
                Practice CRUD, DOM manipulation and the GitHub Pull Request workflow.
            </p>
        </header>


        <!-- Add / Update Movie -->
        <section class="movie-form">

            <h2>Add / Update Movie</h2>

            <div class="form-grid">

                <!-- Left side -->
                <div class="form-group">
                    <label for="title">Movie title</label>
                    <input
                        type="text"
                        id="title"
                        value="The Dark Knight"
                    >

                    <label for="year">Release year</label>
                    <input
                        type="number"
                        id="year"
                        value="2008"
                    >
                </div>


                <!-- Right side -->
                <div class="form-group">
                    <label for="genre">Genre</label>
                    <input
                        type="text"
                        id="genre"
                        value="Action"
                    >

                    <label for="status">Status</label>
                    <select id="status">
                        <option selected>Planned</option>
                        <option>Watched</option>
                    </select>
                </div>

            </div>


            <!-- Buttons -->
            <div class="form-buttons">
                <button class="update-btn">Update Movie</button>
                <button class="cancel-btn">Cancel Edit</button>
            </div>

        </section>


        <!-- Movie List -->
        <section class="movie-list">

            <!-- Search and Filter -->
            <div class="filters">

                <input
                    type="text"
                    placeholder="Search movies..."
                    class="search-box"
                >

                <select class="filter-status">
                    <option>All statuses</option>
                    <option>Planned</option>
                    <option>Watched</option>
                </select>

            </div>


            <!-- Movie 1 -->
            <div class="movie-card">

                <div class="movie-info">
                    <h3>Interstellar</h3>
                    <p>Sci-Fi · 2014</p>
                </div>

                <div class="movie-actions">
                    <span class="watched">Watched</span>
                    <button class="edit-btn">Edit</button>
                    <button class="delete-btn">Delete</button>
                </div>

            </div>


            <!-- Movie 2 -->
            <div class="movie-card">

                <div class="movie-info">
                    <h3>The Dark Knight</h3>
                    <p>Action · 2008</p>
                </div>

                <div class="movie-actions">
                    <span class="planned">Planned</span>
                    <button class="edit-btn">Edit</button>
                    <button class="delete-btn">Delete</button>
                </div>

            </div>

        </section>

    </div>

</body>
</html>
